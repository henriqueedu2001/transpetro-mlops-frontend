# Exemplo de configuracao para treinamento YOLO.
# Os valores deste arquivo substituem os campos equivalentes do formulario.

# Modelo e treinamento
model_version: yolov8
model_size: n
epochs: 10
batch: 16
workers: 8
imgsz: 640
device: "0"
patience: 100

# Otimizacao
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: false
close_mosaic: 10

# Reprodutibilidade
seed: 0
deterministic: true

# Execucao e aumento de dados
amp: true
cache: false
fraction: 1.0
pretrained: true
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
